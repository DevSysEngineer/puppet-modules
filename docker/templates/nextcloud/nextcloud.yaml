# Managed by puppet
services:
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:${NEXTCLOUD_TAG:?nextcloud tag required}
    init: true
    restart: always
    container_name: nextcloud-aio-mastercontainer
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nextcloud-aio
<% if @server_name -%>
    extra_hosts:
      - "<%= @server_name %>:host-gateway"
<% end -%>
    ports:
      - "127.0.0.1:${AIO_ADMIN_PORT:-8080}:8080"
    environment:
      APACHE_PORT: ${APACHE_PORT:-11000}
      APACHE_IP_BINDING: 127.0.0.1

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer

networks:
  nextcloud-aio:
    name: nextcloud-aio
    driver: bridge
    enable_ipv4: true
    enable_ipv6: <%= @ip_version == 'all' %>
