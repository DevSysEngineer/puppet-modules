# Managed by puppet
services:
  runner:
    image: gitlab/gitlab-runner:${TAG:-latest}
    restart: always
    privileged: false
    stop_signal: SIGQUIT
    stop_grace_period: 240s
<% if @runner_ip_correct -%>
    extra_hosts:
      - "${RUNNER_HOST}:${RUNNER_IP}"
<% end -%>
    volumes:
      - type: bind
        source: ./config
        target: /etc/gitlab-runner
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
