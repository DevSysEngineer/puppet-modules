# Managed by puppet

# Database directory.
DatabaseDir "/var/lib/vnstat"

# Keep output predictable.
# Monitoring scripts should use JSON output instead of parsing text output.
Locale "C"
DayFormat "%Y-%m-%d"
MonthFormat "%Y-%m"
TopFormat "%Y-%m-%d"

# Use SI units and bit/s rates.
# This matches most bandwidth and ISP billing models.
UnitMode 2
RateUnit 1
RateUnitMode 1
DefaultDecimals 2
OutputStyle 3
QueryMode 0

# Retention
#
# 122 days of 5-minute data:
# 122 * 24 = 2928 hours
#
# This is enough for:
# - current month 95th percentile
# - previous month comparison
# - roughly 4 months of short-interval incident analysis
5MinuteHours 2928

# Keep hourly data aligned with 5-minute retention.
HourlyDays 122

# Keep 2 years of daily totals.
DailyDays 730

# Keep 4 months of monthly totals.
MonthlyMonths 4

# Keep 5 years of yearly totals.
YearlyYears 5

# Keep more top traffic days for incident analysis.
TopDayEntries 100

# Billing period.
# Use 1 if billing follows calendar months.
# Change this only if the provider uses another billing start day.
MonthRotate 1
MonthRotateAffectsYears 0

# Use local server timezone.
# Set to 1 only if the provider explicitly bills in UTC.
UseUTC 0

# Automatically add every interface discovered by vnstatd.
# Interface-specific fragments can add known speed caps without changing this
# base configuration.
AlwaysAddNewInterfaces 1

# Allow vnstatd to pick up manually added interfaces during database saves.
RescanDatabaseOnSave 1

# Automatic counter detection.
# -2 uses kernel data structures where available.
64bitInterfaceCounters -2

# Bandwidth sanity detection.
BandwidthDetection 1
BandwidthDetectionInterval 5

# Global fallback maximum bandwidth in Mbit/s.
# 0 disables the global reject limit.
#
# Prefer MaxBW<interface> only when the real interface speed is known.
MaxBandwidth 0

# Optional per-interface settings belong in vnstat::ethernet fragments.
# Set MaxBW<interface> only to the real technical interface speed, not to the
# purchased traffic bundle or alert threshold.
#
# MaxBWens192 1000
# MaxBWeth0 10000

# Daemon timings.
PollInterval 5
UpdateInterval 30
SaveInterval 5
OfflineSaveInterval 5
SaveOnStatusChange 1

# Store zero-traffic periods too.
# This makes reporting and comparisons cleaner.
TrafficlessEntries 1

# Operational safety.
CheckDiskSpace 1

# Create missing directories for DatabaseDir, LogFile and PidFile if needed.
# This is useful as a safety net, but Puppet should still manage ownership
# and permissions explicitly.
CreateDirs 1

# Update ownership of database, log and pid files when vnstatd starts as root
# and then drops privileges to DaemonUser/DaemonGroup.
UpdateFileOwner 1

# SQLite behaviour.
DatabaseWriteAheadLogging 1
DatabaseSynchronous -1

# Logging.
# 0 = disabled
# 1 = logfile
# 2 = syslog
UseLogging 1
LogFile "/var/log/vnstat/vnstat.log"

# Run as unprivileged vnstat user/group when started as root.
DaemonUser "vnstat"
DaemonGroup "vnstat"

# Avoid database vacuum on every daemon start.
# Allow manual vacuum with HUP if needed.
VacuumOnStartup 0
VacuumOnHUPSignal 1
