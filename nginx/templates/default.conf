server {
%{listeners}
    server_name _;
<% if @scheme == 'https' -%>
    ssl_reject_handshake on;
    return 444;
<% else -%>
    location = / {
        default_type text/html;
        charset utf-8;
        root /etc/nginx;
        try_files /landing.html =404;
    }

    location / {
        return 404;
    }
<% end -%>
}
