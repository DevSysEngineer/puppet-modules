<% end -%>
<% if @content_security_policy_correct -%>
    # Add Content-Security-Policy only when upstream did not send it.
    add_header Content-Security-Policy $nginx_<%= @security_headers_variable_name %>_csp always;
<% end -%>
<% if @referrer_policy_correct -%>
    # Add Referrer-Policy only when upstream did not send it.
    add_header Referrer-Policy $nginx_<%= @security_headers_variable_name %>_rp always;
<% end -%>

    server_name <%= @redirect_from %>;

<% if (@docroot && @acme_enable) -%>
    # Allow ACME HTTP-01 challenges before redirecting the legacy hostname.
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root <%= @docroot %>;
    }

    # Redirect the legacy hostname to the configured target host.
    location / {
        return 301 https://<%= @redirect_to %>$request_uri;
    }
<% else -%>
    return 301 https://<%= @redirect_to %>$request_uri;
<% end -%>
}
<% end -%>
