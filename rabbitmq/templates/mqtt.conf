# Managed by puppet
<% if @tcp_enable -%>
mqtt.listeners.tcp.default = <%= @tcp_port %>
<% else -%>
mqtt.listeners.tcp = none
<% end -%>
mqtt.allow_anonymous = false
mqtt.listeners.ssl.default = <%= @ssl_port %>
mqtt.vhost = <%= @vhost %>
mqtt.exchange = <%= @exchange %>
mqtt.prefetch = <%= @prefetch %>
