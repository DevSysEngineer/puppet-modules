inherit_gem:
  project-tools-ruby-lint: config/rubocop.yml

inherit_mode:
  merge:
    - Include
    - Exclude

AllCops:
  Include:
    - '.tools/catalog/bin/project-tools-catalog'
    - '.tools/secrets/bin/project-tools-secrets'
    - '.tools/metadata/bin/project-tools-metadata'
    - '.tools/lint/puppet/bin/puppet-lint-junit'
    - '.tools/syntax/bin/syntax-junit'
    - '.tools/module/bin/project-tools-module'
    - '.tools/**/*.rb'
    - '.tools/**/*.rake'
    - '.tools/**/*.gemspec'
  Exclude:
    - 'concat/**/*'
    - 'debconf/**/*'
    - 'reboot/**/*'
    - 'stdlib/**/*'
    - 'vendor/bundle/**/*'
    # ERB source must be rendered before it becomes valid Ruby.
    - '**/templates/**/*'
