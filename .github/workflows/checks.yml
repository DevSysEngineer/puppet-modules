name: Project checks

on:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

env:
  BUNDLE_IGNORE_CONFIG: '1'
  BUNDLE_VERSION: system
  BUNDLE_FROZEN: 'true'
  BUNDLE_PATH: vendor/bundle

defaults:
  run:
    shell: bash

jobs:
  puppet_secrets:
    name: Puppet secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Reject hardcoded Puppet secrets
        run: bundle exec rake secrets:puppet
      - name: Check for changes without source output
        run: git diff --quiet HEAD --

  metadata:
    name: Metadata
    needs: puppet_secrets
    runs-on: ubuntu-24.04
    env:
      PROJECT_METADATA_MODULES_PATH: '.'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Check project and module metadata
        run: bundle exec project-tools-metadata --junit .tools/metadata/results/metadata-report.xml
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --quiet HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete 'Tracked files differ from the checked-out commit.'
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete 'Git could not check the working tree; inspect the native diagnostic above.'
              fi
          fi
      - name: Upload metadata report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Metadata-report
          include-hidden-files: true
          if-no-files-found: error
          path: .tools/metadata/results/metadata-report.xml

  puppet_dependencies:
    name: Puppet dependencies
    needs: puppet_secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Check Puppet module dependencies
        run: |
          export PROJECT_TOOLS_MODULEPATH="$GITHUB_WORKSPACE"
          bundle exec project-tools-module --junit .tools/module/results/project-tools-module-report.xml
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --quiet HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete 'Tracked files differ from the checked-out commit.'
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete 'Git could not check the working tree; inspect the native diagnostic above.'
              fi
          fi
      - name: Upload Puppet dependency report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Project-tools-module-report
          include-hidden-files: true
          if-no-files-found: error
          path: .tools/module/results/project-tools-module-report.xml
      - name: Publish dependency summary
        if: ${{ !cancelled() && hashFiles('.tools/module/results/project-tools-module-report.xml') != '' }}
        uses: test-summary/action@v2
        with:
          paths: .tools/module/results/project-tools-module-report.xml
          show: fail
          folded: false

  syntax:
    name: Puppet syntax
    needs: puppet_secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Check first-party Puppet syntax
        run: bundle exec rake 'syntax:puppet[.tools/syntax/results/syntax-report.xml]'
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --quiet HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete 'Tracked files differ from the checked-out commit.'
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete 'Git could not check the working tree; inspect the native diagnostic above.'
              fi
          fi
      - name: Upload Puppet syntax report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Syntax-report
          include-hidden-files: true
          path: .tools/syntax/results/syntax-report.xml

  catalog:
    name: Puppet catalogs
    needs: puppet_secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Compile module catalogs
        run: bundle exec rake 'catalog:compile[.tools/catalog/results/catalog-report.xml]'
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --quiet HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete 'Tracked files differ from the checked-out commit.'
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete 'Git could not check the working tree; inspect the native diagnostic above.'
              fi
          fi
      - name: Upload Puppet catalog report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Catalog-report
          include-hidden-files: true
          path: .tools/catalog/results/catalog-report.xml

  puppet_lint:
    name: Puppet lint
    needs: puppet_secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Check the complete first-party scope
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Puppet lint'
          mkdir -p .tools/lint/puppet/results
          set +e
          bundle exec puppet-lint --no-config --config .puppet-lint.rc --json . | bundle exec puppet-lint-junit --result-status .tools/lint/puppet/results/puppet-lint-report.xml
          LINT_STATUS=("${PIPESTATUS[@]}")
          LINT_RESULT_STATUS=${LINT_STATUS[1]}
          if [ "$LINT_RESULT_STATUS" -eq 10 ]; then LINT_STATUS[1]=0; fi
          set -e
          printf 'Native scan exit status: %s | Converter exit status: %s\n' "${LINT_STATUS[0]}" "${LINT_STATUS[1]}"
          if [ "${LINT_STATUS[1]}" -ne 0 ]; then
              ci_end "${LINT_STATUS[1]}" ERROR incomplete 'The lint report could not be completed; inspect the converter diagnostic above.'
          elif [ "${LINT_STATUS[0]}" -ne 0 ]; then
              if [ "${LINT_STATUS[0]}" -eq 1 ] && [ "$LINT_RESULT_STATUS" -eq 10 ]; then
                  ci_end 1 FAILED complete 'Lint findings exceed the configured threshold; --fail-on-warnings also rejects warnings.'
              else
                  ci_end "${LINT_STATUS[0]}" ERROR incomplete 'Puppet-lint did not return a confirmed lint outcome; inspect the native diagnostic above.'
              fi
          else
              ci_end 0 PASSED complete
          fi
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --quiet HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete 'Tracked files differ from the checked-out commit.'
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete 'Git could not check the working tree; inspect the native diagnostic above.'
              fi
          fi
      - name: Upload Puppet lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Puppet-lint-report
          include-hidden-files: true
          path: .tools/lint/puppet/results/puppet-lint-report.xml

  ruby_lint:
    name: Ruby lint
    needs: puppet_secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Check first-party Ruby code
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Ruby lint' native
          mkdir -p .tools/lint/ruby/results
          rm -f -- .tools/lint/ruby/results/rubocop-report.xml
          if bundle exec rubocop --config .rubocop.yml --stderr --format progress --format junit --out .tools/lint/ruby/results/rubocop-report.xml; then
              RUBY_STATUS=0
          else
              RUBY_STATUS=$?
          fi
          if [ "$RUBY_STATUS" -le 1 ] && [ -s .tools/lint/ruby/results/rubocop-report.xml ]; then
              printf 'JUnit written: %s\n' .tools/lint/ruby/results/rubocop-report.xml
          fi
          case "$RUBY_STATUS" in
              0) ci_end 0 PASSED complete ;;
              1)
                  if [ -s .tools/lint/ruby/results/rubocop-report.xml ]; then
                      ci_end 1 FAILED complete 'RuboCop offenses exceed the configured failure threshold.'
                  else
                      ci_end 1 ERROR incomplete 'RuboCop exited without a new, non-empty report; inspect the native diagnostic above.'
                  fi
                  ;;
              *) ci_end "$RUBY_STATUS" ERROR incomplete 'RuboCop could not complete the scan or its report; inspect the native diagnostic above.' ;;
          esac
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --quiet HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete 'Tracked files differ from the checked-out commit.'
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete 'Git could not check the working tree; inspect the native diagnostic above.'
              fi
          fi
      - name: Upload Ruby lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Ruby-lint-report
          include-hidden-files: true
          path: .tools/lint/ruby/results/rubocop-report.xml

  tool_tests:
    name: Tool tests
    needs: puppet_secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Run tool tests
        env:
          MINITEST_REPORTERS_REPORTS_DIR: .tools/results/tests
        run: bundle exec rake test
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --quiet HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete 'Tracked files differ from the checked-out commit.'
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete 'Git could not check the working tree; inspect the native diagnostic above.'
              fi
          fi
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Test-results
          include-hidden-files: true
          path: .tools/results/tests/TEST-*.xml
      - name: Publish test summary
        if: ${{ !cancelled() }}
        uses: test-summary/action@v2
        with:
          paths: .tools/results/tests/TEST-*.xml
