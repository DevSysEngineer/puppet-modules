name: Project checks

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  BUNDLE_IGNORE_CONFIG: '1'
  BUNDLE_VERSION: system
  BUNDLE_FROZEN: 'true'
  BUNDLE_PATH: vendor/bundle

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-24.04
    env:
      PROJECT_METADATA_MODULES_PATH: '.'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Check project and module metadata
        run: bundle exec project-tools-metadata --junit .tools/metadata/results/metadata-report.xml
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --exit-code HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete
              fi
          fi
      - name: Upload metadata report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Metadata-report
          include-hidden-files: true
          if-no-files-found: error
          path: .tools/metadata/results/metadata-report.xml

  puppet_dependencies:
    name: Puppet dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Check Puppet module dependencies
        run: |
          export PROJECT_TOOLS_MODULEPATH="$GITHUB_WORKSPACE"
          bundle exec project-tools-module-dependencies --junit .tools/module-dependencies/results/project-tools-module-dependencies-report.xml
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --exit-code HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete
              fi
          fi
      - name: Upload Puppet dependency report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Project-tools-module-dependencies-report
          include-hidden-files: true
          if-no-files-found: error
          path: .tools/module-dependencies/results/project-tools-module-dependencies-report.xml
      - name: Publish dependency summary
        if: ${{ !cancelled() && hashFiles('.tools/module-dependencies/results/project-tools-module-dependencies-report.xml') != '' }}
        uses: test-summary/action@v2
        with:
          paths: .tools/module-dependencies/results/project-tools-module-dependencies-report.xml
          show: fail
          folded: false

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Validate first-party Puppet manifests
        run: bundle exec rake 'validate:puppet[.tools/validate/results/validate-report.xml]'
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --exit-code HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete
              fi
          fi
      - name: Upload Puppet validation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Validate-report
          include-hidden-files: true
          path: .tools/validate/results/validate-report.xml

  puppet_lint:
    name: Puppet lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Check the complete first-party scope
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Puppet lint'
          mkdir -p .tools/lint/results
          set +e
          bundle exec puppet-lint --no-config --config .puppet-lint.rc --json . | bundle exec puppet-lint-junit .tools/lint/results/puppet-lint-report.xml
          LINT_STATUS=("${PIPESTATUS[@]}")
          set -e
          printf 'Native scan exit status: %s | Converter exit status: %s\n' "${LINT_STATUS[0]}" "${LINT_STATUS[1]}"
          if [ "${LINT_STATUS[1]}" -ne 0 ]; then
              ci_end "${LINT_STATUS[1]}" ERROR incomplete
          elif [ "${LINT_STATUS[0]}" -ne 0 ]; then
              ci_end "${LINT_STATUS[0]}" 'Result not classified' unknown
          else
              ci_end 0 PASSED complete
          fi
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --exit-code HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete
              fi
          fi
      - name: Upload Puppet lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Puppet-lint-report
          include-hidden-files: true
          path: .tools/lint/results/puppet-lint-report.xml

  ruby_lint:
    name: Ruby lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Check first-party Ruby code
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Ruby lint' native
          mkdir -p .tools/ruby-lint/results
          rm -f -- .tools/ruby-lint/results/rubocop-report.xml
          if bundle exec rubocop --config .rubocop.yml --stderr --format progress --format junit --out .tools/ruby-lint/results/rubocop-report.xml; then
              RUBY_STATUS=0
          else
              RUBY_STATUS=$?
          fi
          if [ "$RUBY_STATUS" -le 1 ] && [ -f .tools/ruby-lint/results/rubocop-report.xml ]; then
              printf 'JUnit written: %s\n' .tools/ruby-lint/results/rubocop-report.xml
          fi
          case "$RUBY_STATUS" in
              0) ci_end 0 PASSED complete ;;
              1) ci_end 1 FAILED complete ;;
              *) ci_end "$RUBY_STATUS" ERROR incomplete ;;
          esac
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --exit-code HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete
              fi
          fi
      - name: Upload Ruby lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Ruby-lint-report
          include-hidden-files: true
          path: .tools/ruby-lint/results/rubocop-report.xml

  tool_tests:
    name: Tool tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up project tooling
        uses: ./.github/actions/setup-tooling
      - name: Run tool tests
        env:
          MINITEST_REPORTERS_REPORTS_DIR: .tools/results/tests
        run: bundle exec rake test
      - name: Check for changes
        run: |
          source .github/actions/setup-tooling/log.sh
          ci_begin 'Checkout changes'
          if git diff --exit-code HEAD --; then
              ci_end 0 PASSED complete
          else
              CHECKOUT_STATUS=$?
              if [ "$CHECKOUT_STATUS" -eq 1 ]; then
                  ci_end "$CHECKOUT_STATUS" FAILED complete
              else
                  ci_end "$CHECKOUT_STATUS" ERROR incomplete
              fi
          fi
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Test-results
          include-hidden-files: true
          path: .tools/results/tests/TEST-*.xml
      - name: Publish test summary
        if: ${{ !cancelled() }}
        uses: test-summary/action@v2
        with:
          paths: .tools/results/tests/TEST-*.xml
